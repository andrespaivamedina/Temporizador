<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Personalizable</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #ffffff;
            --warning-bg-color: #ffff00; /* Amarillo */
            --negative-bg-color: #ff0000; /* Rojo */
            --timer-font-size: 30rem; /* Letra tamaño 30 por defecto */
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden; /* Evita scrollbars si la letra es muy grande */
        }

        .timer-display {
            font-size: var(--timer-font-size);
            font-variant-numeric: tabular-nums;
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            text-align: center;
            line-height: 1;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            font-weight: bold;
            transition: background-color 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); /* Para que se lea bien en fondos claros */
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Menú de Configuración */
        .config-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 101;
        }

        .config-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .config-menu.active {
            display: block;
        }

        .config-group {
            margin-bottom: 15px;
        }

        .config-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .config-group input[type="color"],
        .config-group input[type="number"],
        .config-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: none;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .config-group input[type="color"] {
            height: 40px;
            padding: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Botón de Configuración -->
    <button class="config-toggle" onclick="toggleConfig()">⚙️ Configuración</button>

    <!-- Panel de Configuración -->
    <div class="config-menu" id="configMenu">
        <h3>Ajustes del Temporizador</h3>
        
        <div class="config-group">
            <label>Modo de cuenta:</label>
            <select id="modeSelect" onchange="updateSettings()">
                <option value="down">Regresivo (Cuenta Atrás)</option>
                <option value="up">Ascendente (Cronómetro)</option>
            </select>
        </div>

        <div class="config-group">
            <label>Tiempo inicial:</label>
            <div class="input-row">
                <input type="number" id="initialMinInput" value="40" min="0" onchange="updateSettings()" placeholder="Min">
                <input type="number" id="initialSecInput" value="0" min="0" max="59" onchange="updateSettings()" placeholder="Seg">
            </div>
            <small style="color: #aaa; font-size: 0.8rem;">Minutos / Segundos</small>
        </div>

        <div class="config-group">
            <label>Límite de aviso:</label>
            <div class="input-row">
                <input type="number" id="warningMinInput" value="1" min="0" onchange="updateSettings()" placeholder="Min">
                <input type="number" id="warningSecInput" value="0" min="0" max="59" onchange="updateSettings()" placeholder="Seg">
            </div>
            <small style="color: #aaa; font-size: 0.8rem;">Minutos / Segundos</small>
        </div>

        <div class="config-group">
            <label>Tamaño de letra:</label>
            <input type="number" id="fontSizeInput" value="30" min="1" max="100" step="0.5" onchange="updateAppearance()">
        </div>

        <div class="config-group">
            <label>Color de fondo (Normal):</label>
            <input type="color" id="bgColorInput" value="#1e1e1e" onchange="updateAppearance()">
        </div>

        <div class="config-group">
            <label>Color de texto principal:</label>
            <input type="color" id="textColorInput" value="#ffffff" onchange="updateAppearance()">
        </div>

        <div class="config-group">
            <label>Color de fondo (Aviso límite):</label>
            <input type="color" id="warningColorInput" value="#ffff00" onchange="updateSettings()">
        </div>

        <div class="config-group" id="negativeColorGroup">
            <label>Color de fondo (Tiempo negativo):</label>
            <input type="color" id="negativeColorInput" value="#ff0000" onchange="updateSettings()">
        </div>
    </div>

    <!-- Pantalla del Temporizador -->
    <div class="timer-display" id="timeDisplay">40:00</div>

    <!-- Controles Principales -->
    <div class="controls">
        <button onclick="toggleTimer()" id="startBtn">▶ Iniciar</button>
        <button onclick="resetTimer()">⏹ Reiniciar</button>
    </div>

    <!-- Añadir Tiempos Rápidos -->
    <div class="controls">
        <button onclick="addTime(10)">+ 10s</button>
        <button onclick="addTime(60)">+ 1 Min</button>
        <button onclick="addTime(300)">+ 5 Min</button>
        <button onclick="addTime(-60)">- 1 Min</button>
    </div>

    <script>
        let timerInterval;
        let isRunning = false;
        
        let currentTime = 2400; // 40 minutos en segundos por defecto
        
        // Variables de configuración
        let mode = 'down';
        let initialTime = 2400;
        let warningTime = 60; // 1 minuto de aviso por defecto
        let warningColor = '#ffff00'; // Amarillo
        let negativeColor = '#ff0000'; // Rojo
        let normalBgColor = '#1e1e1e';

        const display = document.getElementById('timeDisplay');
        const startBtn = document.getElementById('startBtn');

        function toggleConfig() {
            document.getElementById('configMenu').classList.toggle('active');
        }

        function updateAppearance() {
            normalBgColor = document.getElementById('bgColorInput').value;
            
            const fontSize = document.getElementById('fontSizeInput').value;
            document.documentElement.style.setProperty('--timer-font-size', fontSize + 'rem');
            
            document.documentElement.style.setProperty('--text-color', document.getElementById('textColorInput').value);
            
            checkLimitsAndColors();
        }

        function updateSettings() {
            mode = document.getElementById('modeSelect').value;
            
            // Convertir minutos y segundos a segundos totales
            const initMin = parseInt(document.getElementById('initialMinInput').value) || 0;
            const initSec = parseInt(document.getElementById('initialSecInput').value) || 0;
            initialTime = (initMin * 60) + initSec;

            const warnMin = parseInt(document.getElementById('warningMinInput').value) || 0;
            const warnSec = parseInt(document.getElementById('warningSecInput').value) || 0;
            warningTime = (warnMin * 60) + warnSec;

            warningColor = document.getElementById('warningColorInput').value;
            negativeColor = document.getElementById('negativeColorInput').value;
            
            document.getElementById('negativeColorGroup').style.display = (mode === 'down') ? 'block' : 'none';
            
            if (!isRunning) {
                currentTime = mode === 'down' ? initialTime : 0;
                updateDisplay();
            }
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.innerHTML = "▶ Reanudar";
            } else {
                timerInterval = setInterval(tick, 1000);
                startBtn.innerHTML = "⏸ Pausar";
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.innerHTML = "▶ Iniciar";
            currentTime = mode === 'down' ? initialTime : 0;
            updateDisplay();
        }

        function addTime(seconds) {
            currentTime += seconds;
            updateDisplay();
        }

        function tick() {
            if (mode === 'down') {
                currentTime--;
            } else {
                currentTime++;
            }
            updateDisplay();
        }

        function formatTime(seconds) {
            const isNegative = seconds < 0;
            const absSeconds = Math.abs(seconds);
            
            const h = Math.floor(absSeconds / 3600);
            const m = Math.floor((absSeconds % 3600) / 60);
            const s = absSeconds % 60;

            let formatted = '';
            if (isNegative) formatted += '- ';
            if (h > 0) formatted += String(h).padStart(2, '0') + ':';
            formatted += String(m).padStart(2, '0') + ':';
            formatted += String(s).padStart(2, '0');
            
            return formatted;
        }

        function checkLimitsAndColors() {
            let currentBg = normalBgColor;

            if (mode === 'down') {
                if (currentTime < 0) {
                    currentBg = negativeColor; 
                } else if (currentTime <= warningTime) {
                    currentBg = warningColor;  
                }
            } else {
                if (warningTime > 0 && currentTime >= warningTime) {
                    currentBg = warningColor;  
                }
            }

            document.documentElement.style.setProperty('--bg-color', currentBg);
        }

        function updateDisplay() {
            display.innerText = formatTime(currentTime);
            checkLimitsAndColors();
        }

        // Inicialización
        updateSettings();
        updateAppearance();
    </script>
</body>
</html>
